<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#064e3b"><link rel="manifest" href="manifest.json"><title>Розумна кухня</title>
<style>
:root{--ink:#17252a;--forest:#064e3b;--forest2:#0b7a55;--sage:#6fc3a0;--mist:#e3eeea;--cream:#eceff0;--paper:#fafbfb;--terra:#2f62b3;--gold:#6b7b8f;--muted:#6c7a80;--line:#dde2e4;--r:#b5432f;--g:#0b7a55;--o:#2f62b3;--m:#6c7a80;--t:#17252a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--cream);background-image:radial-gradient(circle at 100% 0,#d5dde355 0,transparent 40%),radial-gradient(circle at 0 100%,#c5e3d655 0,transparent 45%);background-attachment:fixed;color:var(--ink);padding-bottom:92px}
h1,h2,.big,.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:600;letter-spacing:.2px}
header{background:linear-gradient(135deg,var(--forest) 0,var(--forest2) 100%);color:#f1f5f4;padding:22px 20px 26px;position:sticky;top:0;z-index:5;border-radius:0 0 28px 28px;box-shadow:0 8px 24px #064e3b33;overflow:hidden}
header:before{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;border:1px solid #ffffff22;box-shadow:0 0 0 22px #ffffff08,0 0 0 48px #ffffff06}
header small{display:block;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#a9e0c8;margin-bottom:4px}
header h1{margin:0;font-size:26px;line-height:1.1;position:relative}
nav{position:fixed;bottom:12px;left:12px;right:12px;display:flex;background:#fffdf8ee;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;z-index:6;box-shadow:0 10px 30px #064e3b22;max-width:696px;margin:auto;padding:6px}
nav button{flex:1;padding:8px 2px 6px;border:0;background:none;font-size:10.5px;letter-spacing:.3px;color:var(--muted);border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--forest),var(--forest2));font-weight:600;box-shadow:0 4px 12px #064e3b44}
main{padding:18px 14px;max-width:720px;margin:auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 1px 0 #fff inset,0 6px 18px #1a2a3010}
.lbl{font-size:12px;color:var(--muted)}.nm{font-size:15px;line-height:1.3}.big{font-size:24px;line-height:1.15}
.eyebrow{font-size:10.5px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-weight:600}
button{font-family:inherit}
button.b{background:linear-gradient(135deg,var(--forest),var(--forest2));color:#fff;border:0;border-radius:14px;padding:11px 16px;font-size:14px;font-weight:600;letter-spacing:.2px;box-shadow:0 4px 12px #064e3b33;transition:transform .1s}
button.b:active{transform:scale(.97)}button.s{background:var(--mist);color:var(--forest2);box-shadow:none}button.w{width:100%;padding:17px;font-size:16px;border-radius:18px}
button.terra{background:linear-gradient(135deg,#4a7fd0,var(--terra))}
button.x{background:none;border:0;color:var(--r);font-size:22px;padding:4px 8px}button.ic{background:none;border:0;font-size:19px;padding:4px 6px}
.tag{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:12px;background:var(--mist);color:var(--forest2);margin:3px 4px 0 0}.tag.n{background:#dde8f8;color:#244f93}.tag.r{background:#f6d9d4;color:var(--r)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}.row>label{min-width:100%;font-weight:600;font-size:13px;letter-spacing:.3px;color:var(--forest)}
select,input[type=search],input[type=number],input[type=date],input[type=text]{padding:11px 12px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:15px;min-width:0;font-family:inherit;color:var(--ink)}input[type=search],input[type=text]{flex:1}
select:focus,input:focus{outline:2px solid var(--sage);border-color:var(--sage)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{padding:10px 16px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:14px;color:var(--ink)}.seg button.on{background:var(--forest2);color:#fff;border-color:var(--forest2)}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);background:#fff;border-radius:14px;margin-bottom:7px;font-size:14px;color:var(--ink)}.opt.on{border-color:var(--forest2);background:var(--mist);box-shadow:0 0 0 2px #2c554522}
.hero{background:linear-gradient(140deg,var(--forest) 0,#2f5d4c 60%,#3d6e59 100%);color:#f1f5f4;border:0;position:relative;overflow:hidden;padding:24px 20px}
.hero:after{content:"";position:absolute;right:-30px;bottom:-50px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#2f62b355,transparent 70%)}
.hero .eyebrow{color:#a9c6f2}.hero .big{font-size:28px;margin:6px 0}.hero .lbl{color:#c3e6d6;position:relative}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tile b{display:block;font-family:"Iowan Old Style",Georgia,serif;font-size:17px;color:var(--ink);margin:10px 0 3px}
.tile .ti{width:38px;height:38px;border-radius:12px;background:var(--mist);display:flex;align-items:center;justify-content:center;color:var(--forest2)}
.tile .ti svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tile .n{position:absolute;right:14px;top:14px;font-family:Georgia,serif;font-size:22px;color:var(--gold)}
.slot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-top:1px dashed var(--line)}.slot.f{border-top:0}
.slot .mi{width:34px;height:34px;border-radius:50%;background:var(--mist);color:var(--forest2);display:flex;align-items:center;justify-content:center;flex:none;font-size:11px;font-weight:700;letter-spacing:.3px}
.slot .mi.snack{background:#dde8f8;color:#244f93}.slot .mi.lunch{background:#d3efe3}.slot .mi.dinner{background:#d9dff0;color:#2b3f7a}
.sh{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px dashed var(--line)}.sh input{width:22px;height:22px;accent-color:var(--forest2)}.sh.d .nm{text-decoration:line-through;color:#a9ada9}.sh>div{flex:1}
.sh b{font-family:Georgia,serif;font-size:15px;color:var(--forest2)}
#modal{position:fixed;inset:0;background:#10201a99;backdrop-filter:blur(3px);z-index:10;display:none}#modal>div{position:absolute;inset:4% 0 0;background:var(--cream);border-radius:28px 28px 0 0;overflow:auto;padding:18px 14px;max-width:720px;margin:auto;box-shadow:0 -10px 40px #0004}
h2{font-size:22px;margin:12px 0 4px}h3{margin:18px 0 6px;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--gold);font-family:inherit;font-weight:700}
ul{margin:4px 0;padding-left:20px}li{margin:3px 0}table{border-collapse:separate;border-spacing:0;font-size:13px;width:100%;overflow:hidden;border:1px solid var(--line);border-radius:12px}td,th{border-bottom:1px solid var(--line);padding:7px 8px;text-align:center}td:first-child,th:first-child{text-align:left}th{background:var(--mist);font-weight:600;color:var(--forest)}tr:last-child td{border-bottom:0}

.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;margin:2px 4px 2px 0;font-weight:500}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 4px;text-align:center}
.ring{--p:0;width:58px;height:58px;border-radius:50%;margin:0 auto 5px;background:conic-gradient(var(--terra) calc(var(--p)*1%),var(--mist) 0);display:flex;align-items:center;justify-content:center;position:relative}
.ring:before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--paper)}.ring b{position:relative;font-family:Georgia,serif;font-size:15px;color:var(--ink)}
.rings span{font-size:10.5px;color:var(--muted);line-height:1.2;display:block}
.macro{display:flex;height:8px;border-radius:5px;overflow:hidden;margin:8px 0 4px;background:var(--mist)}.macro i{display:block;height:100%}.macro .p{background:var(--terra)}.macro .f{background:var(--gold)}.macro .c{background:var(--sage)}
.leg{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}.leg u{text-decoration:none;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}

.divider{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:14px 0}
.stepn{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--terra);color:#fff;font-size:13px;font-weight:700;align-items:center;justify-content:center;margin-right:8px;font-family:Georgia,serif}

  return h+`<div class="lbl">Строки: для готових страв із м'яса, птиці, риби та яєць USDA FSIS радить 3–4 доби в холодильнику й заморожування для довшого зберігання (страви з вершками й супи за запасом коротше); для окремих рецептів із текстом «зберігати…» взято строк із рецепта.</div>`}
 const tot=A.reduce((a,id)=>a+byId[id].tmin,0);
 let h=tabs+`<div class="card"><div class="eyebrow">День заготовок</div><div class="big">${A.length} страв за один день</div><div class="lbl">≈ ${tot} хв сумарно (аерогриль і духовка працюють паралельно з плитою, тож реально менше). Порції: ${A.reduce((a,id)=>a+cnt[id]*P,0)}.</div></div>`;
 A.forEach((id,i)=>{const r=byId[id],q=cnt[id]*P;h+=`<div class="card"><div class="row" style="margin:0 0 6px"><span class="stepn">${i+1}</span><span class="lbl">${r.method} · ≈ ${r.tmin} хв</span></div><b class="serif" style="font-size:17px">${esc(r.name)}</b> <span class="lbl">×${q} порц.</span><ul>${r.ing.filter(x=>x.g>0).map(x=>`<li>${esc(x.n)} — ${Math.round(x.g*q*10)/10} ${x.u}${x.m?" ("+x.m+")":""}</li>`).join("")}</ul><div style="white-space:pre-line">${esc(r.prep)}</div><div style="margin-top:6px">${storeInfo(r)}</div><div class="lbl">Охолодити за 2 години, розкласти в контейнери по порціях.</div></div>`});
 if(B.length)h+=`<div class="card"><b>Збирати або готувати в день вживання</b><ul>${B.map(id=>`<li>${esc(byId[id].name)} ×${cnt[id]*P}</li>`).join("")}</ul></div>`;return h}
function vRec(){return`<div class="row"><input type="search" placeholder="Пошук за назвою чи продуктом" data-a="rq"><select id="rf" data-a="rq"><option value="">Усі</option>${ORDER.map(m=>`<option value="${m}">${MEAL[m]}</option>`).join("")}</select></div><div id="rl"></div>`}
function rlist(){const q=(document.querySelector('[data-a="rq"]')||{value:""}).value.toLowerCase(),f=$("#rf").value;$("#rl").innerHTML=R.filter(r=>(!f||r.type===f)&&(!q||(r.name+" "+r.ing.map(i=>i.k).join(" ")).toLowerCase().includes(q))).map(r=>`<div class="card" data-a="detail" data-id="${r.id}"><b>${S.fav[r.id]?"★ ":""}${esc(r.name)}</b><div class="lbl">${MEAL[r.type]} №${r.num} · ${r.kcal} ккал · ${esc(r.time)}</div></div>`).join("")}
function render(){const t=S.wiz>=0?"wiz":S.tab;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tab&&S.wiz<0));$("#ttl").textContent=TITLES[t];$("#sub").textContent=({home:"Smart Kitchen",plan:"Раціон",shop:"Єдиний список",prep:"План приготування",fridge:"Запаси та залишки",rec:"Збірник",wiz:"Налаштування"})[t];
 app.innerHTML=S.wiz>=0?vWiz():{home:vHome,plan:vPlan,shop:vShop,prep:vPrep,fridge:vFridge,rec:vRec}[S.tab]();if(S.wiz===1)wlist();if(S.tab==="rec"&&S.wiz<0)rlist();window.scrollTo(0,0)}
// ---------- дії ----------
function act(a,d,el){switch(a){
 case"tab":S.tab=d.t;S.wiz=-1;break;case"close":closeM();return;case"detail":detail(d.id);return;case"pick":pick(d.s);return;
 case"set":S.plan[d.s]=d.id;S.pin[d.s]=true;closeM();break;case"pin":S.pin[d.s]=!S.pin[d.s];break;
 case"wiz":S.wiz=+d.n;break;case"cfg":S.cfg[d.n]=isNaN(+d.v)?d.v:+d.v;break;
 case"cfgi":S.cfg[d.n]=d.n==="kcal"?+el.value:el.value;save();return;case"cfgc":S.cfg[d.n]=el.checked;save();return;
 case"slider":S.cfg.w[d.n]=+el.value;$("#wv"+d.n).textContent=el.value;save();return;case"resetw":S.cfg.w={b:65,m:45,l:45,v:15};break;
 case"fav":S.fav[d.id]=!S.fav[d.id];save();if(S.wiz===1)wlist();else if($("#modal").style.display==="block")detail(d.id);else render();return;
 case"ban":S.ban[d.id]=!S.ban[d.id];if(S.ban[d.id])S.fav[d.id]=false;save();if(S.wiz===1)wlist();else detail(d.id);return;
 case"wq":case"wf":wlist();return;case"rq":rlist();return;
 case"gen":case"regen":if(a==="gen"){S.pin=Object.fromEntries(Object.entries(S.pin).filter(([k])=>slots().includes(k)))}optimize();S.wiz=-1;S.tab="plan";S.done={};break;
 case"clearplan":if(!confirm("Очистити меню?"))return;S.plan={};S.pin={};S.done={};break;
 case"sub":S.sub=d.v;break;case"done":S.done[d.k]=el.checked;save();render();return;
 case"copy":{const t=shopList().filter(i=>i.buy>0).map(i=>i.k+" — "+Math.round(i.buy)+" "+i.u).join("\n");try{navigator.clipboard.writeText(t);alert("Скопійовано")}catch(e){prompt("Скопіюйте список",t)}return}
 case"bought":{const L=shopList().filter(i=>i.buy>0),ch=L.filter(i=>S.done[i.k]),use=ch.length?ch:L;use.forEach(i=>S.fridge.push({id:Date.now()+Math.random(),k:i.k,g:Math.round(i.buy),exp:addD(today(),SHELF[i.k]||7)}));S.done={};break}
 case"fadd":{const k=$("#fk").value.trim().toLowerCase(),g=+$("#fg").value;if(!k||!g)return alert("Вкажіть продукт і вагу");S.fridge.push({id:Date.now()+Math.random(),k,g,exp:$("#fe").value||addD(today(),SHELF[k]||7)});break}
 case"fdel":S.fridge=S.fridge.filter(i=>String(i.id)!==d.id);break;
 case"consume":{const nd=need(S.plan);for(const k in nd){let r=nd[k];S.fridge.filter(i=>i.k===k).sort((a,b)=>a.exp.localeCompare(b.exp)).forEach(i=>{const u=Math.min(i.g,r);i.g-=u;r-=u});}S.fridge=S.fridge.filter(i=>i.g>0.5);break}
 }save();render()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t||t.tagName==="INPUT"||t.tagName==="SELECT")return;if(t.dataset.a==="done"){return}act(t.dataset.a,t.dataset,t)});
document.addEventListener("change",e=>{const t=e.target.closest("[data-a]");if(t&&["INPUT","SELECT"].includes(t.tagName)&&!["slider","wq","rq"].includes(t.dataset.a))act(t.dataset.a,t.dataset,t)});
document.addEventListener("input",e=>{const t=e.target.closest("[data-a]");if(t&&["slider","wq","rq"].includes(t.dataset.a))act(t.dataset.a,t.dataset,t)});
document.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.a==="wf")wlist()});
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
